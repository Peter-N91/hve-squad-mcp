# Local Phase 0 sandbox for SQUAD_MCP_STAGE_EXECUTOR=copilot.
#
#   COPILOT_CONNECTION_TOKEN=$(openssl rand -hex 32) \
#   docker compose -f host/sandbox/compose.yaml up --build
#
# The server supplies the GitHub identity to each session (see README.md);
# never set COPILOT_GITHUB_TOKEN here, where the agent's shell could read it.
# A runtime binds to the first server that connects, so restart this sandbox
# whenever the server restarts.
#
# The runtime port is published on loopback only. Egress is the default bridge
# network: Phase 0 relies on the executor's per-request network policy. A
# hosted deployment must add an allow-list egress proxy and block the cloud
# metadata endpoint at the network layer (see README.md).
services:
  copilot-sandbox:
    build:
      context: .
      dockerfile: Containerfile
    image: hve-squad-copilot-sandbox:phase0
    environment:
      COPILOT_CONNECTION_TOKEN: ${COPILOT_CONNECTION_TOKEN:?set a random connection token of at least 32 characters}
      COPILOT_BROWSER_ALLOWED_HOSTS: ${COPILOT_BROWSER_ALLOWED_HOSTS:-}
    ports:
      - "127.0.0.1:4321:4321"
    read_only: true
    tmpfs:
      - /tmp:size=256m
      - /home/agent:size=512m,uid=10001,gid=10001
      - /workspace:size=1g,uid=10001,gid=10001
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 2g
    cpus: 2
