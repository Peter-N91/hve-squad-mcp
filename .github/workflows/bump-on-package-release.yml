# Track hve-squad releases by opening a pull request, not by pushing to main.
#
# The previous version committed a pin bump, a version bump, and a CHANGELOG
# entry straight to `main`. That is three violations of the release contract in
# one job: the version and the changelog move only in release-prep, and nothing
# reaches `main` without PR validation and CI.
#
# It also did NOT refresh the bundled cast, on the grounds that doing so needed a
# local `apm install`. That is no longer true — `snapshot:cast` resolves every
# bundled file from the release's own `apm.yml` over HTTPS — so this workflow now
# refreshes the bundle and lets CI verify it.
#
# WHY A HUMAN STILL MERGES
# A hve-squad release can rename or retire roster roles. `0.11.0` did exactly
# that, which is how `tools.catalog.yml` came to bind three tools to agents HVE
# Core no longer ships. Auto-merging such a release would replace a stale bundle
# with a broken one. The pull request runs the drift checks that catch it, and a
# maintainer decides.
name: Bump on hve-squad release

on:
  schedule:
    - cron: '0 7 * * *'
  # checkov:skip=CKV_GHA_7:CKV_GHA_7 targets workflows that BUILD a release artifact. This one opens a pull request; it produces no release and merges nothing. The single input names the hve-squad version to pin, and the snapshot refuses a tag that does not declare that exact version, so the input cannot silently change what the bundle contains.
  workflow_dispatch:
    inputs:
      version:
        description: 'hve-squad version to pin (e.g. 0.12.4). Empty = latest release.'
        required: false
        type: string
  repository_dispatch:
    types: [hve-squad-released]

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  PACKAGE_REPO: Peter-N91/hve-squad

jobs:
  bump:
    name: Open a pin-bump pull request
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      # Reading a private package repo needs a PAT; the job token cannot see it.
      - name: Resolve the target version
        id: target
        env:
          GH_TOKEN: ${{ secrets.PACKAGE_SYNC_TOKEN || github.token }}
          INPUT_VERSION: ${{ inputs.version }}
          DISPATCH_VERSION: ${{ github.event.client_payload.version }}
        run: |
          set -euo pipefail
          V="$INPUT_VERSION"
          [ -z "$V" ] && V="$DISPATCH_VERSION"
          if [ -z "$V" ]; then
            V=$(gh release view --repo "$PACKAGE_REPO" --json tagName -q .tagName)
          fi
          V="${V#v}"
          if [ -z "$V" ]; then
            echo "::error::Could not resolve a target hve-squad version."
            exit 1
          fi
          CUR=$(jq -r '.version' host/cast/package-pin.json)
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "current=$CUR" >> "$GITHUB_OUTPUT"
          if [ "$CUR" = "$V" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Already pinned to $V."
            exit 0
          fi
          HIGH=$(printf '%s\n%s\n' "$CUR" "$V" | sort -V | tail -n1)
          if [ "$HIGH" != "$V" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "$V is not newer than the current pin $CUR."
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Bump the pin and refresh the bundled cast
        if: steps.target.outputs.skip != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.PACKAGE_SYNC_TOKEN || github.token }}
          TARGET: ${{ steps.target.outputs.version }}
        run: |
          set -euo pipefail
          tmp=$(mktemp)
          jq --arg v "$TARGET" '.version = $v' host/cast/package-pin.json > "$tmp"
          mv "$tmp" host/cast/package-pin.json
          # The snapshot fails when the tag does not declare this version, so a
          # mistyped or moved tag stops here rather than producing a bundle
          # labelled as something it is not.
          npm run snapshot:cast
          npm run generate
          npm run generate:connector

      # A fragment, not a CHANGELOG edit: the version moves on main, in release-prep.
      - name: Write the change fragment
        if: steps.target.outputs.skip != 'true'
        env:
          TARGET: ${{ steps.target.outputs.version }}
          CURRENT: ${{ steps.target.outputs.current }}
        run: |
          set -euo pipefail
          npm run change -- \
            --type Changed \
            --bump minor \
            --force \
            --title "pin hve-squad $TARGET" \
            --body "- **Bumped the bundled cast pin from \`$CURRENT\` to \`$PACKAGE_REPO@$TARGET\`** and refreshed \`host/cast/\` from that release's \`apm.yml\`. A cast change is a minor: the squad a consumer gets is different."

      - name: Open the pull request
        if: steps.target.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.PACKAGE_SYNC_TOKEN || secrets.RELEASE_TOKEN }}
          TARGET: ${{ steps.target.outputs.version }}
          CURRENT: ${{ steps.target.outputs.current }}
        run: |
          set -euo pipefail
          # Checked BEFORE the branch is pushed. The job token can push a branch
          # but CANNOT open a pull request, so falling back to it did all the work
          # and then failed on the last line, stranding the bump on a branch
          # nobody was told about. Fail here instead, with nothing to clean up.
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::No pull-request token. GitHub blocks the Actions job token from creating pull requests, so this workflow needs a PAT in PACKAGE_SYNC_TOKEN (or reuses RELEASE_TOKEN) with contents:write and pull-requests:write. The alternative is Settings > Actions > General > 'Allow GitHub Actions to create and approve pull requests', which also lets workflows APPROVE pull requests — prefer the PAT."
            exit 1
          fi
          BRANCH="chore/pin-hve-squad-$TARGET"
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          # Check for an open PULL REQUEST, not for the branch. A previous run
          # pushed the branch and then failed at `gh pr create`, and a
          # branch-exists guard read that as "already open" and exited clean —
          # so the bump sat stranded on a branch nobody was told about while
          # every later run reported success. Recover by opening the PR.
          if gh pr list --head "$BRANCH" --state open --json number --jq 'length' | grep -qx '[1-9][0-9]*'; then
            echo "::notice::A pull request is already open for $TARGET."
            exit 0
          fi

          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            echo "::notice::$BRANCH already exists without an open pull request — reusing it."
            git fetch origin "$BRANCH"
            git checkout -B "$BRANCH" "origin/$BRANCH"
          else
            git checkout -b "$BRANCH"
            git add host/cast .changes/unreleased generated
            git commit -m "chore(cast): pin ${PACKAGE_REPO}@${TARGET}"
            git push origin "$BRANCH"
          fi
          {
            echo "Tracks \`$PACKAGE_REPO\` \`$CURRENT\` -> \`$TARGET\`."
            echo
            echo "The bundled cast under \`host/cast/\` was regenerated from that release's \`apm.yml\`, and the generated artifacts were rebuilt."
            echo
            echo "**Review before merging.** A hve-squad release can rename or retire roster roles; the CI drift checks (\`generate:check\`, \`snapshot:cast:check\`, and the cast-bundle suite) are what catch a catalog left bound to an agent that no longer exists."
            echo
            echo "The version and \`CHANGELOG.md\` are deliberately untouched — release-prep moves them on \`main\` from the fragment in this branch."
          } > /tmp/pr-body.md
          if ! gh pr create \
            --title "chore(cast): pin ${PACKAGE_REPO}@${TARGET}" \
            --body-file /tmp/pr-body.md \
            --base main \
            --head "$BRANCH"; then
            echo "::error::Pushed $BRANCH but could not open the pull request. The configured token lacks pull-requests:write, or the repository forbids it. The branch is pushed, so opening the pull request by hand loses nothing."
            exit 1
          fi
