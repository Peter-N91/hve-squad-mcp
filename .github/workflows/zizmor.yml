# Scan the workflows themselves for insecure patterns.
#
# The workflows here hold `contents: write` and a release token, so a template
# injection or an unpinned action in this directory is a supply-chain hole rather
# than a lint nit. Findings are reported, not blocking: zizmor flags patterns
# that are sometimes correct, and a hard fail would train reviewers to bypass it.
name: Zizmor

on:
  push:
    branches: [main]
    paths: ['.github/workflows/**']
  pull_request:
    branches: [main]
    paths: ['.github/workflows/**']
  schedule:
    - cron: '30 4 * * 1'
  workflow_dispatch:

concurrency:
  group: zizmor-${{ github.ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  zizmor:
    name: GitHub Actions security scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: false

      - name: Run zizmor
        run: uvx zizmor --format sarif .github/workflows/ > zizmor.sarif || true

      - name: Upload SARIF to code scanning
        if: ${{ !cancelled() }}
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: zizmor.sarif
          category: zizmor

      - name: Retain the full SARIF
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zizmor-sarif
          path: zizmor.sarif
          retention-days: 30
