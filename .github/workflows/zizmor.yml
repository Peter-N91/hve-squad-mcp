# Scan the workflows themselves for insecure patterns.
#
# The workflows here hold `contents: write` and a release token, so a template
# injection or an unpinned action in this directory is a supply-chain hole rather
# than a lint nit. Findings are reported, not blocking: zizmor flags patterns
# that are sometimes correct, and a hard fail would train reviewers to bypass it.
name: Zizmor

on:
  push:
    branches: [main]
    paths: ['.github/workflows/**']
  pull_request:
    branches: [main]
    paths: ['.github/workflows/**']
  schedule:
    - cron: '30 4 * * 1'
  workflow_dispatch:

concurrency:
  group: zizmor-${{ github.ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  zizmor:
    name: GitHub Actions security scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false

      - name: Run zizmor
        run: uvx zizmor --format sarif .github/workflows/ > zizmor.sarif || true

      - name: Upload SARIF to code scanning
        if: ${{ !cancelled() }}
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: zizmor.sarif
          category: zizmor

      - name: Retain the full SARIF
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zizmor-sarif
          path: zizmor.sarif
          retention-days: 30
