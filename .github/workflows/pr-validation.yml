# Gate every pull request on the release contract.
#
# The version and the changelog move ONLY on `main`, assembled from the fragments
# under `.changes/unreleased/`. A pull request that edited either would conflict
# with every other open pull request, so this workflow rejects that diff and
# requires a fragment instead.
#
# It deliberately does NOT run tests — `ci.yml` owns that. Splitting them means a
# missing fragment is reported as a missing fragment rather than buried in a test
# log, and a red test does not hide a release-state violation.
name: PR validation

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  release-state:
    name: Release state and change fragment
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Compute the diff against the base
        id: diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # Diff against the MERGE BASE, not the base branch tip. `base.sha` is
          # whatever main pointed at when the event fired, so a branch that has
          # fallen behind reads main's own newer commits as reversions — which
          # rejected a bot pin-bump for "editing CHANGELOG.md" it never touched.
          MERGE_BASE=$(git merge-base "$BASE_SHA" "$HEAD_SHA")
          echo "merge-base=$MERGE_BASE" >> "$GITHUB_OUTPUT"
          git diff --name-only "$MERGE_BASE" "$HEAD_SHA" > /tmp/changed.txt
          echo "Changed files:"
          cat /tmp/changed.txt

      - name: Reject edits to release state
        env:
          MERGE_BASE: ${{ steps.diff.outputs.merge-base }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if grep -qx 'CHANGELOG.md' /tmp/changed.txt; then
            echo "::error file=CHANGELOG.md::CHANGELOG.md is assembled on main from .changes/unreleased/. Add a fragment with 'npm run change' instead."
            exit 1
          fi
          if git diff "$MERGE_BASE" "$HEAD_SHA" -- package.json | grep -qE '^[+-]\s*"version"\s*:'; then
            echo "::error file=package.json::The version is bumped on main by release-prep. Do not edit it in a pull request."
            exit 1
          fi

      - name: Require a change fragment
        env:
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          if grep -qE '^\.changes/unreleased/[0-9]{8}-.+\.md$' /tmp/changed.txt; then
            echo "Change fragment present."
            exit 0
          fi
          case ",$LABELS," in
            *,skip-changelog,*)
              echo "::notice::No fragment, but the skip-changelog label is applied."
              exit 0
              ;;
          esac
          # Dependabot cannot author a fragment: it only knows how to bump a
          # manifest and apply labels, and it silently DROPS a label the
          # repository does not define — which is what wedged every bot pull
          # request until `skip-changelog` was created. Exempting by author as
          # well means a missing label can never block the bot again.
          #
          # A runtime-dependency bump can still be consumer-visible (a major
          # `jose` or SDK move). That is a judgement call, so a maintainer adds
          # a fragment to the bot's branch when it warrants one.
          if [ "$PR_AUTHOR" = "dependabot[bot]" ]; then
            echo "::notice::No fragment; author is dependabot[bot]. Add one to this branch if the bump is consumer-visible."
            exit 0
          fi
          echo "::error::This pull request adds no change fragment. Run 'npm run change', or apply the skip-changelog label when the change has no consumer-visible effect."
          exit 1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Resolve the version this pull request would release
        run: |
          npm run release:prep -- --dry-run >> "$GITHUB_STEP_SUMMARY" 2>&1 || {
            echo "::error::Release prep rejected a pending fragment — see the job summary."
            exit 1
          }
