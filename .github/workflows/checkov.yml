# Scan the workflows, the Bicep, and the tree for embedded secrets.
#
# This repository is PUBLIC and ships infrastructure a consumer deploys into
# their own tenant, so a leaked value or an over-permissioned template is a
# defect in the product rather than only in our pipeline. Blocking by design: an
# accepted finding carries an inline `# checkov:skip=<id>:<reason>` that states
# why, which is reviewable, rather than a soft-fail nobody reads.
name: Checkov

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checkov:
    name: IaC, workflow, and secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install Checkov
        run: python -m pip install --no-cache-dir checkov==3.2.533

      - name: Run Checkov
        run: |
          checkov --directory . \
            --framework github_actions secrets bicep \
            --skip-path node_modules --skip-path dist --skip-path host/cast \
            --output cli --output sarif --output-file-path console,results.sarif

      # Checkov records an inline `checkov:skip` as a SARIF `suppressions` entry
      # carrying its justification, and Checkov's own exit code honours it. GitHub
      # Code Scanning does NOT read that property, so an accepted finding still
      # lands in the Security tab as an open alert — which trains people to ignore
      # the Security tab, the one outcome a scanner must avoid.
      #
      # Suppressed results are therefore dropped before upload and reported here
      # instead, so the justification stays visible and reviewable rather than
      # silently disappearing. The artifact below keeps the UNFILTERED SARIF.
      - name: Report and drop suppressed results
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          jq '(.runs[]?.results) |= map(select((.suppressions // []) | length == 0))' \
            results.sarif > code-scanning.sarif

          COUNT=$(jq '[.runs[]?.results[]? | select((.suppressions // []) | length > 0)] | length' results.sarif)
          echo "### Checkov: $COUNT accepted finding(s)" >> "$GITHUB_STEP_SUMMARY"
          if [ "$COUNT" -gt 0 ]; then
            {
              echo
              echo "| Rule | Location | Justification |"
              echo "|------|----------|---------------|"
              jq -r '.runs[]?.results[]?
                | select((.suppressions // []) | length > 0)
                | "| \(.ruleId) | \(.locations[0].physicalLocation.artifactLocation.uri):\(.locations[0].physicalLocation.region.startLine) | \(.suppressions[0].justification // "none given") |"' \
                results.sarif
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload SARIF to code scanning
        if: ${{ !cancelled() }}
        uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          sarif_file: code-scanning.sarif
          category: checkov

      - name: Retain the full SARIF
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: checkov-sarif
          path: results.sarif
          retention-days: 30
