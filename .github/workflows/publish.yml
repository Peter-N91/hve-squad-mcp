# Publish @hve-squad/mcp to the npm registry.
#
# Manual only, by design: unlike release.yml (which also fires on a
# package.json/CHANGELOG.md push), this workflow has NO automatic trigger.
# It never runs as a side effect of a version-bump commit landing on `main`,
# nor of release.yml cutting a tag/GitHub Release — a maintainer runs it
# explicitly (workflow_dispatch) after reviewing that release, which is the
# held/manual gate this repo wants around the first real publish.
#
# checkov:skip=CKV_GHA_7:CKV_GHA_7 workflow_dispatch is required here: this
# is the intentional manual trigger for the publish action itself, not an
# input that changes the bytes of a build artifact. The published tarball is
# built from source already committed to the resolved tag; no input here
# influences its contents.
name: Publish to npm

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: npm publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Reuses release.yml's own version-tag logic: publish only what a real
      # release already tagged, never an untagged working tree.
      - name: Resolve version and confirm its release tag exists
        id: version
        run: |
          VERSION=$(jq -r '.version' package.json)
          if [ -z "$VERSION" ] || [ "$VERSION" = "null" ]; then
            echo "::error::Could not read .version from package.json."
            exit 1
          fi
          TAG="v$VERSION"
          if ! git ls-remote --tags origin "refs/tags/$TAG" | awk '{print $2}' | grep -qx "refs/tags/$TAG"; then
            echo "::error::Tag $TAG does not exist yet. Run release.yml (or workflow_dispatch it) to cut the release before publishing."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Publishing v$VERSION"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public
