# Static analysis for the server itself.
#
# Language is javascript-typescript, not python: this repository is TypeScript
# plus Bicep, and CodeQL cannot analyse Bicep at all (checkov.yml covers that).
name: CodeQL

on:
  push:
    branches: [main]
    paths: ['**/*.ts', '.github/workflows/codeql.yml']
  pull_request:
    branches: [main]
    paths: ['**/*.ts', '.github/workflows/codeql.yml']
  schedule:
    - cron: '26 3 * * 4'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze TypeScript
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          languages: javascript-typescript
          build-mode: none

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          category: '/language:javascript-typescript'
