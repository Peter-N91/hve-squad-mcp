# Static analysis for the server itself.
#
# Language is javascript-typescript, not python: this repository is TypeScript
# plus Bicep, and CodeQL cannot analyse Bicep at all (checkov.yml covers that).
name: CodeQL

on:
  push:
    branches: [main]
    paths: ['**/*.ts', '.github/workflows/codeql.yml']
  pull_request:
    branches: [main]
    paths: ['**/*.ts', '.github/workflows/codeql.yml']
  schedule:
    - cron: '26 3 * * 4'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze TypeScript
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          languages: javascript-typescript
          build-mode: none

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          category: '/language:javascript-typescript'
